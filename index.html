<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Фон — Красная комната с белыми звёздами, сеткой и рамками</title>
    <style>
        /* Базовый сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #0a0506;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
        }

        /* ========== ФОН (тот же самый, без изменений) ========== */
        .room-base {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 50% 40%, rgba(45, 8, 12, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 15% 85%, rgba(35, 5, 8, 0.9) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 15%, rgba(28, 4, 7, 0.7) 0%, transparent 45%),
                linear-gradient(180deg, 
                    #0d0405 0%, 
                    #1a0709 20%, 
                    #22090c 40%, 
                    #160607 60%, 
                    #0b0304 80%, 
                    #090203 100%);
            z-index: 0;
        }

        .room-shadow {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            z-index: 1;
            pointer-events: none;
        }

        .shadow-main {
            width: 80vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.9) 0%, transparent 70%);
            top: 30%;
            left: 10%;
            animation: shadowBreath 10s infinite alternate;
        }

        .shadow-side-left {
            width: 45vw;
            height: 85vh;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.85) 0%, transparent 65%);
            top: 8%;
            left: -18%;
            animation: shadowBreath 12s infinite alternate-reverse;
        }

        .shadow-side-right {
            width: 40vw;
            height: 75vh;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.75) 0%, transparent 60%);
            top: 18%;
            right: -12%;
            animation: shadowBreath 14s infinite alternate;
        }

        .red-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .glow-center {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, 
                rgba(230, 57, 70, 0.22) 0%, 
                rgba(230, 57, 70, 0.08) 40%, 
                transparent 70%);
            top: 28%;
            left: 22%;
            animation: glowPulse 8s infinite alternate;
        }

        .glow-deep {
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, 
                rgba(155, 28, 40, 0.28) 0%, 
                rgba(155, 28, 40, 0.1) 35%, 
                transparent 65%);
            bottom: 8%;
            right: 12%;
            animation: glowPulse 10s infinite alternate-reverse;
        }

        .glow-soft {
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle, 
                rgba(255, 77, 90, 0.18) 0%, 
                rgba(230, 57, 70, 0.06) 50%, 
                transparent 70%);
            top: 8%;
            left: 48%;
            animation: glowPulse 7s infinite alternate;
        }

        .glow-floor {
            width: 65vw;
            height: 25vh;
            background: radial-gradient(ellipse, 
                rgba(230, 57, 70, 0.2) 0%, 
                transparent 70%);
            bottom: -5%;
            left: 18%;
            animation: glowPulse 9s infinite alternate;
        }

        .light-shaft {
            position: fixed;
            z-index: 2;
            pointer-events: none;
            filter: blur(4px);
            opacity: 0.2;
            transform-origin: top center;
        }

        .shaft-1 {
            width: 5px;
            height: 75vh;
            background: linear-gradient(180deg, 
                rgba(230, 57, 70, 0.45) 0%, 
                rgba(230, 57, 70, 0.18) 40%, 
                transparent 85%);
            top: -10%;
            left: 28%;
            transform: rotate(5deg);
            animation: shaftFade 6s infinite alternate;
        }

        .shaft-2 {
            width: 3px;
            height: 65vh;
            background: linear-gradient(180deg, 
                rgba(230, 57, 70, 0.3) 0%, 
                rgba(230, 57, 70, 0.1) 50%, 
                transparent 90%);
            top: -5%;
            right: 22%;
            transform: rotate(-4deg);
            animation: shaftFade 8s infinite alternate-reverse;
        }

        /* ========== СЕТКИ (адаптивные, но выглядят как раньше) ========== */
        .grid-top-right {
            position: fixed;
            top: clamp(10px, 4vw, 40px);
            right: clamp(10px, 4vw, 40px);
            width: clamp(100px, 45vw, 480px);
            height: clamp(100px, 45vw, 480px);
            z-index: 3;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px);
            background-size: clamp(15px, 4vw, 40px) clamp(15px, 4vw, 40px);
            opacity: 0.75;
            mask-image: radial-gradient(ellipse at 100% 0%, 
                rgba(0, 0, 0, 0.9) 0%, 
                rgba(0, 0, 0, 0.5) 40%, 
                rgba(0, 0, 0, 0.1) 70%, 
                transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at 100% 0%, 
                rgba(0, 0, 0, 0.9) 0%, 
                rgba(0, 0, 0, 0.5) 40%, 
                rgba(0, 0, 0, 0.1) 70%, 
                transparent 100%);
            animation: gridPulse1 9s infinite alternate;
        }

        .grid-left {
            position: fixed;
            top: 55%;
            left: clamp(5px, 2vw, 20px);
            width: clamp(60px, 18vw, 180px);
            height: clamp(60px, 18vw, 180px);
            z-index: 3;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: clamp(10px, 2.5vw, 25px) clamp(10px, 2.5vw, 25px);
            opacity: 0.5;
            mask-image: radial-gradient(ellipse at 0% 50%, 
                rgba(0, 0, 0, 0.9) 0%, 
                rgba(0, 0, 0, 0.5) 40%, 
                rgba(0, 0, 0, 0.1) 70%, 
                transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at 0% 50%, 
                rgba(0, 0, 0, 0.9) 0%, 
                rgba(0, 0, 0, 0.5) 40%, 
                rgba(0, 0, 0, 0.1) 70%, 
                transparent 100%);
            animation: gridPulseSide 10s infinite alternate;
        }

        .grid-right {
            position: fixed;
            top: 15%;
            right: clamp(5px, 2vw, 20px);
            width: clamp(60px, 18vw, 180px);
            height: clamp(60px, 18vw, 180px);
            z-index: 3;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: clamp(10px, 2.5vw, 25px) clamp(10px, 2.5vw, 25px);
            opacity: 0.5;
            mask-image: radial-gradient(ellipse at 100% 50%, 
                rgba(0, 0, 0, 0.9) 0%, 
                rgba(0, 0, 0, 0.5) 40%, 
                rgba(0, 0, 0, 0.1) 70%, 
                transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at 100% 50%, 
                rgba(0, 0, 0, 0.9) 0%, 
                rgba(0, 0, 0, 0.5) 40%, 
                rgba(0, 0, 0, 0.1) 70%, 
                transparent 100%);
            animation: gridPulseSide 11s infinite alternate-reverse;
        }

        /* ========== РАМКИ (тот же дизайн, адаптивные) ========== */
        .frame {
            position: fixed;
            z-index: 7;
            pointer-events: none;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: clamp(10px, 3vw, 30px);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.06),
                inset 0 0 30px rgba(255, 255, 255, 0.04);
            width: clamp(180px, 42vw, 420px);
            height: clamp(60px, 18vh, 130px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.02);
        }

        .frame-1 {
            top: 4%;
            height: clamp(100px, 35vh, 280px);
            animation: frameFloat1 10s infinite alternate ease-in-out;
            overflow: hidden;
        }

        .frame-2 {
            top: clamp(30%, 42vh, 42%);
            animation: frameFloat3 12s infinite alternate ease-in-out;
        }

        .frame-3 {
            top: clamp(45%, 61vh, 61%);
            animation: frameFloat1 13s infinite alternate ease-in-out;
        }

        .frame-4 {
            top: clamp(60%, 80vh, 80%);
            animation: frameFloat2 14s infinite alternate ease-in-out;
        }

        .frame-photo {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(35%, 42%, 42%);
            height: clamp(60%, 80%, 80%);
            border-radius: clamp(8px, 2vw, 20px);
            object-fit: cover;
            opacity: 0.8;
            filter: grayscale(30%) contrast(1.1) brightness(0.9);
            transition: 0.4s;
        }

        .photo-glow {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(35%, 45%, 45%);
            height: clamp(60%, 85%, 85%);
            border-radius: clamp(8px, 2vw, 25px);
            background: radial-gradient(ellipse, 
                rgba(230, 57, 70, 0.5) 0%, 
                rgba(230, 57, 70, 0.25) 40%, 
                rgba(230, 57, 70, 0.08) 70%, 
                transparent 100%);
            filter: blur(clamp(15px, 4vw, 40px));
            z-index: -1;
            animation: photoGlowPulse 3s infinite alternate;
        }

        .frame-title {
            position: absolute;
            top: clamp(8px, 2vh, 20px);
            left: clamp(10px, 2.5vw, 25px);
            z-index: 9;
            font-size: clamp(0.7rem, 2.5vw, 1.6rem);
            font-weight: 900;
            color: rgba(180, 30, 40, 0.8);
            letter-spacing: clamp(0.3px, 0.1vw, 1px);
            text-shadow: 
                0 0 10px rgba(180, 30, 40, 0.4),
                0 0 20px rgba(180, 30, 40, 0.2);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .frame-divider {
            position: absolute;
            top: clamp(30px, 9vh, 95px);
            left: clamp(10px, 2.5vw, 25px);
            width: clamp(80px, 22vw, 220px);
            height: clamp(2px, 0.4vh, 4px);
            background: linear-gradient(90deg, 
                rgba(230, 57, 70, 0.7) 0%, 
                rgba(230, 57, 70, 0.2) 100%);
            z-index: 9;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.3);
        }

        .frame-subtitle {
            position: absolute;
            top: clamp(35px, 10vh, 110px);
            left: clamp(10px, 2.5vw, 25px);
            z-index: 9;
            font-size: clamp(0.55rem, 1.6vw, 1.05rem);
            font-weight: 900;
            color: rgba(160, 160, 168, 0.6);
            letter-spacing: clamp(0.2px, 0.05vw, 0.3px);
            max-width: clamp(80px, 22vw, 190px);
            line-height: 1.8;
        }

        .plus {
            position: absolute;
            right: clamp(8px, 1.8vw, 18px);
            bottom: clamp(8px, 1.8vh, 18px);
            width: clamp(12px, 2.4vw, 24px);
            height: clamp(12px, 2.4vw, 24px);
            z-index: 8;
            pointer-events: none;
            opacity: 0.3;
            font-size: clamp(0.7rem, 2.2vw, 1.4rem);
            font-weight: bold;
            color: rgba(255, 255, 255, 0.45);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
            line-height: 1;
            text-align: center;
        }

        /* Звёзды */
        .star {
            position: fixed;
            z-index: 4;
            pointer-events: none;
            color: #ffffff;
            opacity: 0.3;
            animation: starDriftDown linear infinite;
        }
        .star-tiny { font-size: clamp(1.5px, 0.4vw, 3px); }
        .star-small { font-size: clamp(2px, 0.5vw, 4px); }
        .star-micro { font-size: clamp(1px, 0.3vw, 2px); }
        .star-medium { font-size: clamp(2.5px, 0.6vw, 5px); }

        @keyframes starDriftDown {
            0% { transform: translateY(-5vh) translateX(0); opacity: 0; }
            10% { opacity: 0.4; }
            50% { opacity: 0.3; }
            90% { opacity: 0.2; }
            100% { transform: translateY(105vh) translateX(15px); opacity: 0; }
        }

        @keyframes photoGlowPulse {
            0% { opacity: 0.7; transform: translateY(-50%) scale(1); }
            100% { opacity: 1; transform: translateY(-50%) scale(1.1); }
        }

        .floor-mist {
            position: fixed;
            width: clamp(200px, 75vw, 800px);
            height: clamp(40px, 20vh, 200px);
            background: radial-gradient(ellipse, rgba(230, 57, 70, 0.06) 0%, transparent 60%);
            bottom: 0;
            left: 12%;
            z-index: 3;
            pointer-events: none;
            filter: blur(clamp(20px, 5vw, 50px));
            animation: mistFloat 12s infinite alternate;
        }

        .dust {
            position: fixed;
            width: clamp(1px, 0.2vw, 1.5px);
            height: clamp(1px, 0.2vw, 1.5px);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
            animation: dustFloat 10s infinite alternate ease-in-out;
        }

        .vignette-deep {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(10, 5, 6, 0.8) 70%, rgba(10, 5, 6, 0.95) 100%);
            z-index: 5;
            pointer-events: none;
        }

        .noise-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            background-size: clamp(100px, 15vw, 170px) clamp(100px, 15vw, 170px);
            opacity: 0.05;
            z-index: 6;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* ========== АНИМАЦИИ (тот же характер) ========== */
        @keyframes shadowBreath {
            0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            100% { transform: translate(30px, 20px) scale(1.1); opacity: 1; }
        }
        @keyframes glowPulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }
        @keyframes shaftFade {
            0% { opacity: 0.08; filter: blur(4px); }
            100% { opacity: 0.3; filter: blur(1.5px); }
        }
        @keyframes gridPulse1 {
            0% { opacity: 0.6; transform: translate(0, 0); }
            100% { opacity: 0.85; transform: translate(-10px, 10px); }
        }
        @keyframes gridPulseSide {
            0% { opacity: 0.35; transform: translate(0, 0); }
            100% { opacity: 0.6; transform: translate(5px, -5px); }
        }
        @keyframes frameFloat1 {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-3px); }
        }
        @keyframes frameFloat2 {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-2px); }
        }
        @keyframes frameFloat3 {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-4px); }
        }
        @keyframes mistFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            100% { transform: translate(30px, -10px) scale(1.1); opacity: 0.8; }
        }
        @keyframes dustFloat {
            0% { transform: translate(0, 0); opacity: 0.3; }
            100% { transform: translate(12px, -20px); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <!-- Фон и свечения -->
    <div class="room-base"></div>
    <div class="room-shadow shadow-main"></div>
    <div class="room-shadow shadow-side-left"></div>
    <div class="room-shadow shadow-side-right"></div>
    <div class="red-glow glow-center"></div>
    <div class="red-glow glow-deep"></div>
    <div class="red-glow glow-soft"></div>
    <div class="red-glow glow-floor"></div>
    <div class="light-shaft shaft-1"></div>
    <div class="light-shaft shaft-2"></div>

    <!-- Сетки -->
    <div class="grid-top-right"></div>

    <!-- Туман -->
    <div class="floor-mist"></div>

    <!-- Пыль -->

    <div class="star star-tiny" style="left: 39%; animation-duration: 23s; animation-delay: 3.5s;">✧</div>

    <div class="star star-micro" style="left: 71%; animation-duration: 18s; animation-delay: 0.9s;">✧</div>
    <div class="star star-tiny" style="left: 75%; animation-duration: 26s; animation-delay: 2.1s;">✦</div>

    <div class="star star-small" style="left: 5%; animation-duration: 24s; animation-delay: 4s;">✦</div>
    <div class="star star-tiny" style="left: 13%; animation-duration: 27s; animation-delay: 5s;">✧</div>
    <div class="star star-micro" style="left: 21%; animation-duration: 20s; animation-delay: 6s;">✦</div>
    <div class="star star-small" style="left: 29%; animation-duration: 23s; animation-delay: 7s;">✧</div>
    <div class="star star-tiny" style="left: 37%; animation-duration: 26s; animation-delay: 8s;">✦</div>
    <div class="star star-micro" style="left: 45%; animation-duration: 18s; animation-delay: 9s;">✧</div>
