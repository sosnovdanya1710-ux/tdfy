<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <title>Фон — Красная комната</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        body {
            background-color: #0a0506;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            -webkit-overflow-scrolling: touch;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .room-base {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0a0506;
            background-image: 
                radial-gradient(ellipse at 50% 40%, rgba(45, 8, 12, 0.8) 0%, rgba(45, 8, 12, 0) 60%),
                radial-gradient(ellipse at 15% 85%, rgba(35, 5, 8, 0.9) 0%, rgba(35, 5, 8, 0) 50%),
                radial-gradient(ellipse at 85% 15%, rgba(28, 4, 7, 0.7) 0%, rgba(28, 4, 7, 0) 45%);
            z-index: 0;
            pointer-events: none;
        }

        .room-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, #0d0405 0%, #1a0709 20%, #22090c 40%, #160607 60%, #0b0304 80%, #090203 100%);
            z-index: 0;
            pointer-events: none;
        }

        .shadow {
            position: fixed;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        .shadow-1 {
            width: 80vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 70%);
            top: 30%;
            left: 10%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .shadow-2 {
            width: 45vw;
            height: 85vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 65%);
            top: 8%;
            left: -18%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .shadow-3 {
            width: 40vw;
            height: 75vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 60%);
            top: 18%;
            right: -12%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }

        .glow-1 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(255, 50, 65, 0.5) 0%, rgba(230, 57, 70, 0) 70%);
            top: 28%;
            left: 22%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-2 {
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(180, 25, 35, 0.55) 0%, rgba(155, 28, 40, 0) 65%);
            bottom: 8%;
            right: 12%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-3 {
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle, rgba(255, 60, 75, 0.42) 0%, rgba(255, 77, 90, 0) 70%);
            top: 8%;
            left: 48%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-4 {
            width: 65vw;
            height: 25vh;
            background: radial-gradient(ellipse, rgba(255, 45, 60, 0.48) 0%, rgba(230, 57, 70, 0) 70%);
            bottom: -5%;
            left: 18%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        /* Сетка на весь экран */
        .grid-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
            background-size: clamp(30px, 5vw, 50px) clamp(30px, 5vw, 50px);
            opacity: 0.4;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px;
            gap: 20px;
            min-height: 100vh;
            justify-content: flex-start;
        }

        /* Рамки с лёгким блюром */
        .frame {
            position: relative;
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(255,255,255,0.04), inset 0 0 20px rgba(255,255,255,0.03);
            background: rgba(255,255,255,0.01);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            -moz-backdrop-filter: blur(4px);
            width: 100%;
            max-width: 420px;
            flex-shrink: 0;
        }

        .frame-main {
            height: 280px;
            overflow: hidden;
            border-radius: 45px;
        }

        .frame-small {
            height: 130px;
            position: relative;
            overflow: hidden;
            border-radius: 35px;
        }

        /* Внутренняя рамка */
        .inner-frame {
            position: absolute;
            left: 15px;
            top: 45px;
            width: 55%;
            height: 75px;
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 15px;
            background: rgba(255,255,255,0.02);
            box-shadow: 0 0 15px rgba(255,255,255,0.04), inset 0 0 15px rgba(255,255,255,0.03);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 9;
            display: flex;
            align-items: center;
            padding: 10px;
        }

        .inner-frame-text {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: rgba(235, 235, 240, 0.7);
            text-transform: none;
            line-height: 1.4;
            font-family: 'Rubik', Arial, sans-serif;
        }

        /* Фото */
        .photo {
            position: absolute;
            right: -20px;
            top: 48%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 58%;
            height: 88%;
            border-radius: 20px;
            object-fit: contain;
            opacity: 0.85;
            -webkit-filter: grayscale(20%) contrast(1.05) brightness(0.95);
            filter: grayscale(20%) contrast(1.05) brightness(0.95);
            z-index: 10;
        }

        /* Неон за фото */
        .photo-glow {
            position: absolute;
            right: -25px;
            top: 48%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 62%;
            height: 92%;
            border-radius: 25px;
            background: radial-gradient(ellipse, rgba(255, 50, 65, 0.6) 0%, rgba(230, 40, 55, 0.3) 40%, rgba(200, 20, 30, 0.1) 70%, rgba(200, 20, 30, 0) 100%);
            -webkit-filter: blur(35px);
            filter: blur(35px);
            z-index: 9;
            animation: neonPulse 2s infinite alternate;
        }

        @keyframes neonPulse {
            0% { opacity: 0.7; }
            100% { opacity: 0.9; }
        }

        /* Заголовок */
        .title-left {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 11;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            max-width: 45%;
            line-height: 1.1;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .title-red {
            color: rgba(180, 25, 35, 0.8);
            text-shadow: 0 0 8px rgba(180, 25, 35, 0.3);
        }

        .title-white {
            color: rgba(235, 235, 240, 0.55);
            text-shadow: 0 0 6px rgba(235, 235, 240, 0.15);
            display: inline-block;
            margin-top: 5px;
        }

        /* Кнопка красная */
        .btn-red {
            position: absolute;
            top: 140px;
            left: 25px;
            z-index: 11;
            padding: 20px 50px;
            border: 1.5px solid rgba(200, 15, 25, 0.65);
            border-radius: 30px;
            background: rgba(180, 15, 25, 0.3);
            color: rgba(255, 255, 255, 0.75);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 30px rgba(200, 15, 25, 0.45), inset 0 0 20px rgba(200, 15, 25, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 45%;
            white-space: nowrap;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .btn-red:active {
            transform: scale(0.95);
            background: rgba(180, 15, 25, 0.38);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            filter: brightness(0) invert(1);
            opacity: 0.8;
        }

        /* Кнопка белая */
        .btn-white {
            position: absolute;
            top: 220px;
            left: 25px;
            z-index: 11;
            padding: 20px 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset 0 0 18px rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 45%;
            white-space: nowrap;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .btn-white:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.18);
        }

        /* Заголовки в малых рамках */
        .second-title,
        .third-title,
        .fourth-title {
            position: absolute;
            top: 12px;
            left: 15px;
            z-index: 11;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            line-height: 1.3;
            max-width: 50%;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .second-red,
        .third-red,
        .fourth-red {
            color: rgba(180, 25, 35, 0.8);
            text-shadow: 0 0 8px rgba(180, 25, 35, 0.3);
        }

        .second-white,
        .third-white,
        .fourth-white {
            color: rgba(235, 235, 240, 0.55);
            text-shadow: 0 0 6px rgba(235, 235, 240, 0.15);
        }

        /* Вертикальная линия */
        .vertical-line {
            position: absolute;
            left: 62%;
            top: 0;
            bottom: 0;
            width: 1.5px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 8px rgba(255,255,255,0.04), inset 0 0 8px rgba(255,255,255,0.03);
            z-index: 8;
        }

        /* Статистика справа */
        .stats {
            position: absolute;
            left: 70%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 11;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-main {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: rgba(235, 235, 240, 0.8);
            white-space: nowrap;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .stat-sub {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(235, 235, 240, 0.5);
            white-space: nowrap;
            font-family: 'Rubik', Arial, sans-serif;
        }

        /* Разделительная линия */
        .divider-line {
            width: 85%;
            max-width: 380px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 20%, rgba(255,255,255,0.35) 80%, transparent 100%);
            opacity: 0.6;
            margin: 5px 0;
        }

        /* Ценовые карточки */
        .price-cards {
            position: absolute;
            left: 15px;
            right: 15px;
            top: 42px;
            bottom: 12px;
            display: flex;
            gap: 8px;
            z-index: 11;
            align-items: flex-end;
        }

        .price-card {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 8px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            min-width: 0;
            box-shadow: 0 0 15px rgba(255,255,255,0.04), inset 0 0 15px rgba(255,255,255,0.03);
            position: relative;
            overflow: hidden;
        }

        .price-card.tall {
            height: 115%;
            justify-content: center;
            margin-bottom: 16px;
            min-height: 115%;
        }

        .price-card.short {
            height: 85%;
            justify-content: center;
            margin-bottom: 8px;
        }

        .price-title {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: rgba(235, 235, 240, 0.75);
            white-space: nowrap;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .price-card.short .price-title {
            font-size: 11px;
            font-weight: 900;
        }

        .price-amount {
            font-size: 22px;
            font-weight: 900;
            color: rgba(180, 25, 35, 0.7);
            letter-spacing: 0.5px;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(180, 25, 35, 0.2);
            margin: 4px 0;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .price-card.short .price-amount {
            font-size: 19px;
            font-weight: 900;
        }

        .price-amount-white {
            color: rgba(255, 255, 255, 0.85);
            text-shadow: none;
            font-weight: 900;
        }

        .price-sub {
            font-size: 12px;
            font-weight: 700;
            color: rgba(235, 235, 240, 0.5);
            white-space: nowrap;
            letter-spacing: 0.2px;
            font-family: 'Rubik', Arial, sans-serif;
        }

        .price-card.short .price-sub {
            font-size: 10px;
            font-weight: 700;
        }

        /* Звездочка популярное */
        .popular-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 11px;
            height: 11px;
            filter: brightness(0) invert(1);
            opacity: 0.7;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(10,5,6,0.8) 70%, rgba(10,5,6,0.95) 100%);
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .content {
                padding: 15px 15px 30px;
                gap: 15px;
            }
            .frame-main {
                height: 220px;
                border-radius: 35px;
            }
            .frame-small {
                height: 110px;
                border-radius: 30px;
            }
            .photo {
                width: 60%;
                height: 90%;
                border-radius: 15px;
                right: -15px;
                top: 45%;
            }
            .photo-glow {
                width: 64%;
                height: 94%;
                right: -20px;
                top: 45%;
            }
            .title-left {
                top: 12px;
                left: 12px;
                font-size: 26px;
                letter-spacing: 0.3px;
                max-width: 42%;
            }
            .btn-red {
                top: 88px;
                left: 10px;
                padding: 14px 30px;
                font-size: 14px;
                letter-spacing: 0.6px;
                max-width: 48%;
                border-radius: 28px;
                gap: 6px;
            }
            .btn-icon {
                width: 16px;
                height: 16px;
            }
            .btn-white {
                top: 148px;
                left: 10px;
                padding: 14px 30px;
                font-size: 12px;
                letter-spacing: 0.4px;
                max-width: 48%;
                border-radius: 28px;
                gap: 6px;
            }
            .second-title,
            .third-title,
            .fourth-title {
                top: 8px;
                left: 12px;
                font-size: 16px;
                letter-spacing: 0.3px;
                max-width: 48%;
            }
            .vertical-line {
                left: 58%;
                width: 1px;
            }
            .inner-frame {
                left: 10px;
                top: 38px;
                width: 52%;
                height: 60px;
                padding: 8px;
            }
            .inner-frame-text {
                font-size: 11px;
                line-height: 1.3;
            }
            .stats {
                left: 64%;
                gap: 10px;
            }
            .stat-main {
                font-size: 18px;
            }
            .stat-sub {
                font-size: 10px;
            }
            .divider-line {
                width: 80%;
            }
            .price-cards {
                left: 10px;
                right: 10px;
                top: 38px;
                bottom: 8px;
                gap: 5px;
            }
            .price-card.tall {
                margin-bottom: 11px;
            }
            .price-card.short {
                margin-bottom: 5px;
            }
            .price-card {
                border-radius: 16px;
            }
            .price-title {
                font-size: 10px;
            }
            .price-card.short .price-title {
                font-size: 8px;
            }
            .price-amount {
                font-size: 17px;
            }
            .price-card.short .price-amount {
                font-size: 14px;
            }
            .price-sub {
                font-size: 9px;
            }
            .price-card.short .price-sub {
                font-size: 7px;
            }
            .popular-badge {
                width: 9px;
                height: 9px;
                top: 4px;
                right: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="room-base"></div>
    <div class="room-gradient"></div>
    <div class="shadow shadow-1"></div>
    <div class="shadow shadow-2"></div>
    <div class="shadow shadow-3"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="glow glow-4"></div>
    <div class="grid-full"></div>

    <div class="content">
        <div class="frame frame-main">
            <div class="photo-glow"></div>
            <img class="photo" src="https://i.postimg.cc/SsmHrJGk/file-00000000e5d081f49bc9e7c6512b4e6e.png" alt="Фото">
            <div class="title-left">
                <span class="title-red">Викладач</span> <span class="title-white">Англійської</span>
            </div>
            <button class="btn-red">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <line x1="19" y1="8" x2="19" y2="14"/>
                    <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
                Записатись
            </button>
            <button class="btn-white">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                Пробний урок
            </button>
        </div>

        <div class="divider-line"></div>

        <div class="frame frame-small">
            <div class="vertical-line"></div>
            <div class="second-title" style="max-width: 50%; line-height: 1.4; font-size: 18px;">
                <span class="second-red" style="font-size: 18px;">Про</span> <span class="second-white" style="font-size: 18px;">мене</span>
            </div>
            <div class="inner-frame">
                <span class="inner-frame-text">Звати Олексій, 19 років. Викладаю англійську онлайн. Шукаю учнів.</span>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-main">3+ роки</div>
                    <div class="stat-sub">викладання</div>
                </div>
                <div class="stat-item">
                    <div class="stat-main">25+ учнів</div>
                    <div class="stat-sub">навчаю</div>
                </div>
            </div>
        </div>

        <div class="frame frame-small">
            <div class="third-title">
                <span class="third-red">Вар</span><span class="third-white">тість</span>
            </div>
            <div class="price-cards">
                <div class="price-card short">
                    <div class="price-title">Разове</div>
                    <div class="price-amount">200 <span class="price-amount-white">₴</span></div>
                    <div class="price-sub">1 заняття</div>
                </div>
                <div class="price-card tall">
                    <svg class="popular-badge" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <div class="price-title">Стандарт</div>
