<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <title>Фон — Красная комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        body {
            background-color: #0a0506;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-overflow-scrolling: touch;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .room-base {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0a0506;
            background-image: 
                radial-gradient(ellipse at 50% 40%, rgba(45, 8, 12, 0.8) 0%, rgba(45, 8, 12, 0) 60%),
                radial-gradient(ellipse at 15% 85%, rgba(35, 5, 8, 0.9) 0%, rgba(35, 5, 8, 0) 50%),
                radial-gradient(ellipse at 85% 15%, rgba(28, 4, 7, 0.7) 0%, rgba(28, 4, 7, 0) 45%);
            z-index: 0;
            pointer-events: none;
        }

        .room-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, #0d0405 0%, #1a0709 20%, #22090c 40%, #160607 60%, #0b0304 80%, #090203 100%);
            z-index: 0;
            pointer-events: none;
        }

        .shadow {
            position: fixed;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        .shadow-1 {
            width: 80vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 70%);
            top: 30%;
            left: 10%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .shadow-2 {
            width: 45vw;
            height: 85vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 65%);
            top: 8%;
            left: -18%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .shadow-3 {
            width: 40vw;
            height: 75vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 60%);
            top: 18%;
            right: -12%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }

        .glow-1 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.22) 0%, rgba(230, 57, 70, 0) 70%);
            top: 28%;
            left: 22%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-2 {
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(155, 28, 40, 0.28) 0%, rgba(155, 28, 40, 0) 65%);
            bottom: 8%;
            right: 12%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-3 {
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle, rgba(255, 77, 90, 0.18) 0%, rgba(255, 77, 90, 0) 70%);
            top: 8%;
            left: 48%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-4 {
            width: 65vw;
            height: 25vh;
            background: radial-gradient(ellipse, rgba(230, 57, 70, 0.2) 0%, rgba(230, 57, 70, 0) 70%);
            bottom: -5%;
            left: 18%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        /* ОДНА БОЛЬШАЯ СЕТКА НА ВЕСЬ ЭКРАН — ЧУТЬ ПРОЗРАЧНЕЕ */
        .grid-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
            background-size: clamp(30px, 5vw, 50px) clamp(30px, 5vw, 50px);
            opacity: 0.4;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px;
            gap: 20px;
            min-height: 100vh;
            justify-content: flex-start;
        }

        .frame {
            position: relative;
            border: 1.5px solid rgba(255,255,255,0.18);
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(255,255,255,0.06), inset 0 0 30px rgba(255,255,255,0.04);
            background: rgba(255,255,255,0.02);
            width: 100%;
            max-width: 420px;
            flex-shrink: 0;
        }

        .frame-main {
            height: 280px;
            overflow: hidden;
        }

        .frame-small {
            height: 130px;
        }

        .photo {
            position: absolute;
            right: 0;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 42%;
            height: 80%;
            border-radius: 20px;
            object-fit: cover;
            opacity: 0.8;
            -webkit-filter: grayscale(30%) contrast(1.1) brightness(0.9);
            filter: grayscale(30%) contrast(1.1) brightness(0.9);
            z-index: 10;
        }

        .photo-glow {
            position: absolute;
            right: 0;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 45%;
            height: 85%;
            border-radius: 25px;
            background: radial-gradient(ellipse, rgba(230,57,70,0.5) 0%, rgba(230,57,70,0.25) 40%, rgba(230,57,70,0) 70%);
            -webkit-filter: blur(40px);
            filter: blur(40px);
            z-index: 9;
        }

        .plus {
            position: absolute;
            right: 18px;
            bottom: 18px;
            width: 24px;
            height: 24px;
            z-index: 8;
            opacity: 0.3;
            font-size: 22px;
            font-weight: bold;
            color: rgba(255,255,255,0.45);
            text-shadow: 0 0 8px rgba(255,255,255,0.15);
            line-height: 1;
            text-align: center;
        }

        .star {
            position: fixed;
            z-index: 4;
            color: #ffffff;
            opacity: 0.3;
            animation: starFall linear infinite;
            pointer-events: none;
        }

        @keyframes starFall {
            0% { transform: translateY(-5vh); opacity: 0; }
            10% { opacity: 0.4; }
            50% { opacity: 0.3; }
            90% { opacity: 0.2; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(10,5,6,0.8) 70%, rgba(10,5,6,0.95) 100%);
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .content {
                padding: 15px 15px 30px;
                gap: 15px;
            }
            .frame-main {
                height: 220px;
                border-radius: 20px;
            }
            .frame-small {
                height: 110px;
                border-radius: 20px;
            }
            .photo {
                width: 45%;
                height: 75%;
                border-radius: 15px;
            }
            .photo-glow {
                width: 48%;
                height: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="room-base"></div>
    <div class="room-gradient"></div>
    <div class="shadow shadow-1"></div>
    <div class="shadow shadow-2"></div>
    <div class="shadow shadow-3"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="glow glow-4"></div>
    <div class="grid-full"></div>

    <div class="content">
        <div class="frame frame-main">
            <div class="photo-glow"></div>
            <img class="photo" src="https://i.postimg.cc/SsmHrJGk/file-00000000e5d081f49bc9e7c6512b4e6e.png" alt="Фото">
        </div>

        <div class="frame frame-small"><div class="plus">+</div></div>
        <div class="frame frame-small"><div class="plus">+</div></div>
        <div class="frame frame-small"><div class="plus">+</div></div>
    </div>

    <div class="star" style="left: 3%; font-size: 3px; animation-duration: 22s;">✦</div>
    <div class="star" style="left: 7%; font-size: 4px; animation-duration: 25s; animation-delay: 1s;">✧</div>
    <div class="star" style="left: 11%; font-size: 2px; animation-duration: 18s; animation-delay: 2s;">✦</div>
    <div class="star" style="left: 15%; font-size: 3px; animation-duration: 28s; animation-delay: 0.5s;">✧</div>
    <div class="star" style="left: 19%; font-size: 4px; animation-duration: 20s; animation-delay: 1.5s;">✦</div>
    <div class="star" style="left: 23%; font-size: 2px; animation-duration: 24s; animation-delay: 3s;">✧</div>
    <div class="star" style="left: 27%; font-size: 3px; animation-duration: 21s; animation-delay: 0.8s;">✦</div>
    <div class="star" style="left: 31%; font-size: 4px; animation-duration: 26s; animation-delay: 2.2s;">✧</div>
    <div class="star" style="left: 35%; font-size: 2px; animation-duration: 19s; animation-delay: 1.2s;">✦</div>
    <div class="star" style="left: 39%; font-size: 3px; animation-duration: 23s; animation-delay: 3.5s;">✧</div>
    <div class="star" style="left: 43%; font-size: 4px; animation-duration: 27s; animation-delay: 0.3s;">✦</div>
    <div class="star" style="left: 47%; font-size: 2px; animation-duration: 17s; animation-delay: 2.8s;">✧</div>
    <div class="star" style="left: 51%; font-size: 3px; animation-duration: 29s; animation-delay: 1.8s;">✦</div>
    <div class="star" style="left: 55%; font-size: 4px; animation-duration: 22s; animation-delay: 0.6s;">✧</div>
    <div class="star" style="left: 59%; font-size: 2px; animation-duration: 25s; animation-delay: 2.5s;">✦</div>
    <div class="star" style="left: 63%; font-size: 3px; animation-duration: 20s; animation-delay: 1.1s;">✧</div>
    <div class="star" style="left: 67%; font-size: 4px; animation-duration: 24s; animation-delay: 3.2s;">✦</div>
    <div class="star" style="left: 71%; font-size: 2px; animation-duration: 18s; animation-delay: 0.9s;">✧</div>
    <div class="star" style="left: 75%; font-size: 3px; animation-duration: 26s; animation-delay: 2.1s;">✦</div>
    <div class="star" style="left: 79%; font-size: 4px; animation-duration: 21s; animation-delay: 1.6s;">✧</div>
    <div class="star" style="left: 83%; font-size: 2px; animation-duration: 23s; animation-delay: 0.4s;">✦</div>
    <div class="star" style="left: 87%; font-size: 3px; animation-duration: 28s; animation-delay: 2.7s;">✧</div>
    <div class="star" style="left: 91%; font-size: 4px; animation-duration: 19s; animation-delay: 1.3s;">✦</div>
    <div class="star" style="left: 95%; font-size: 2px; animation-duration: 25s; animation-delay: 3.7s;">✧</div>

    <div class="vignette"></div>
</body>
</html>
