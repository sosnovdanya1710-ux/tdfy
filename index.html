<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Адаптивный фон — Красная комната</title>
    <style>
        /* ========== БАЗОВЫЙ СБРОС ========== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        body {
            background-color: #0a0506;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-family: 'Arial', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* ========== УНИВЕРСАЛЬНЫЕ УТИЛИТЫ ========== */
        .fixed-layer {
            position: fixed;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* ========== БАЗОВЫЙ ФОН ========== */
        .room-base {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(45, 8, 12, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 15% 85%, rgba(35, 5, 8, 0.9) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 15%, rgba(28, 4, 7, 0.7) 0%, transparent 45%),
                linear-gradient(180deg,
                    #0d0405 0%,
                    #1a0709 20%,
                    #22090c 40%,
                    #160607 60%,
                    #0b0304 80%,
                    #090203 100%);
            z-index: 0;
        }

        /* ========== ОБЪЁМНЫЕ ТЕНИ ========== */
        .room-shadow {
            position: fixed;
            border-radius: 50%;
            filter: blur(clamp(3rem, 10vw, 7rem));
            -webkit-filter: blur(clamp(3rem, 10vw, 7rem));
            -moz-filter: blur(clamp(3rem, 10vw, 7rem));
            z-index: 1;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .shadow-main {
            width: 80vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.9) 0%, transparent 70%);
            top: 30%;
            left: 10%;
            animation: shadowBreath 10s infinite alternate;
        }

        .shadow-side-left {
            width: 45vw;
            height: 85vh;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.85) 0%, transparent 65%);
            top: 8%;
            left: -18%;
            animation: shadowBreath 12s infinite alternate-reverse;
        }

        .shadow-side-right {
            width: 40vw;
            height: 75vh;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.75) 0%, transparent 60%);
            top: 18%;
            right: -12%;
            animation: shadowBreath 14s infinite alternate;
        }

        /* ========== КРАСНОЕ СВЕЧЕНИЕ ========== */
        .red-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(clamp(4rem, 12vw, 8rem));
            -webkit-filter: blur(clamp(4rem, 12vw, 8rem));
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
            will-change: opacity, transform;
        }

        .glow-center {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle,
                rgba(230, 57, 70, 0.22) 0%,
                rgba(230, 57, 70, 0.08) 40%,
                transparent 70%);
            top: 28%;
            left: 22%;
            animation: glowPulse 8s infinite alternate;
        }

        .glow-deep {
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle,
                rgba(155, 28, 40, 0.28) 0%,
                rgba(155, 28, 40, 0.1) 35%,
                transparent 65%);
            bottom: 8%;
            right: 12%;
            animation: glowPulse 10s infinite alternate-reverse;
        }

        .glow-soft {
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle,
                rgba(255, 77, 90, 0.18) 0%,
                rgba(230, 57, 70, 0.06) 50%,
                transparent 70%);
            top: 8%;
            left: 48%;
            animation: glowPulse 7s infinite alternate;
        }

        .glow-floor {
            width: 65vw;
            height: 25vh;
            background: radial-gradient(ellipse,
                rgba(230, 57, 70, 0.2) 0%,
                transparent 70%);
            bottom: -5%;
            left: 18%;
            animation: glowPulse 9s infinite alternate;
        }

        /* ========== ЛУЧИ СВЕТА ========== */
        .light-shaft {
            position: fixed;
            z-index: 2;
            pointer-events: none;
            filter: blur(0.25rem);
            -webkit-filter: blur(0.25rem);
            opacity: 0.2;
            transform-origin: top center;
            will-change: opacity, filter;
        }

        .shaft-1 {
            width: clamp(0.2rem, 0.5vw, 0.35rem);
            height: 75vh;
            background: linear-gradient(180deg,
                rgba(230, 57, 70, 0.45) 0%,
                rgba(230, 57, 70, 0.18) 40%,
                transparent 85%);
            top: -10%;
            left: 28%;
            transform: rotate(5deg);
            animation: shaftFade 6s infinite alternate;
        }

        .shaft-2 {
            width: clamp(0.15rem, 0.3vw, 0.2rem);
            height: 65vh;
            background: linear-gradient(180deg,
                rgba(230, 57, 70, 0.3) 0%,
                rgba(230, 57, 70, 0.1) 50%,
                transparent 90%);
            top: -5%;
            right: 22%;
            transform: rotate(-4deg);
            animation: shaftFade 8s infinite alternate-reverse;
        }

        /* ========== СЕТКИ ========== */
        .grid-top-right {
            position: fixed;
            top: clamp(0.5rem, 4vw, 2.5rem);
            right: clamp(0.5rem, 4vw, 2.5rem);
            width: clamp(6rem, 48vw, 30rem);
            height: clamp(6rem, 48vw, 30rem);
            z-index: 3;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1.5px, transparent 1.5px);
            background-size: clamp(1rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2.5rem);
            opacity: 0.75;
            mask-image: radial-gradient(ellipse at 100% 0%,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.1) 70%,
                transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at 100% 0%,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.1) 70%,
                transparent 100%);
            animation: gridPulse1 9s infinite alternate;
            will-change: opacity, transform;
        }

        .grid-left {
            position: fixed;
            top: 55%;
            left: clamp(0.3rem, 2vw, 1.25rem);
            width: clamp(4rem, 20vw, 11rem);
            height: clamp(4rem, 20vw, 11rem);
            z-index: 3;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: clamp(0.6rem, 2.5vw, 1.5rem) clamp(0.6rem, 2.5vw, 1.5rem);
            opacity: 0.5;
            mask-image: radial-gradient(ellipse at 0% 50%,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.1) 70%,
                transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at 0% 50%,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.1) 70%,
                transparent 100%);
            animation: gridPulseSide 10s infinite alternate;
        }

        .grid-right {
            position: fixed;
            top: 15%;
            right: clamp(0.3rem, 2vw, 1.25rem);
            width: clamp(4rem, 20vw, 11rem);
            height: clamp(4rem, 20vw, 11rem);
            z-index: 3;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: clamp(0.6rem, 2.5vw, 1.5rem) clamp(0.6rem, 2.5vw, 1.5rem);
            opacity: 0.5;
            mask-image: radial-gradient(ellipse at 100% 50%,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.1) 70%,
                transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse at 100% 50%,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.1) 70%,
                transparent 100%);
            animation: gridPulseSide 11s infinite alternate-reverse;
        }

        /* ========== РАМКИ ========== */
        .frame {
            position: fixed;
            z-index: 7;
            pointer-events: none;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: clamp(0.8rem, 3vw, 2rem);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            -moz-backdrop-filter: blur(8px);
            box-shadow:
                0 0 clamp(1rem, 3vw, 2rem) rgba(255, 255, 255, 0.06),
                inset 0 0 clamp(1rem, 3vw, 2rem) rgba(255, 255, 255, 0.04);
            width: clamp(12rem, 42vw, 26rem);
            height: clamp(4.5rem, 18vh, 8rem);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.02);
            will-change: transform;
        }

        .frame-1 {
            top: clamp(1rem, 4vh, 4%);
            height: clamp(8rem, 35vh, 17rem);
            animation: frameFloat1 10s infinite alternate ease-in-out;
            overflow: hidden;
        }

        .frame-2 {
            top: clamp(28%, 42vh, 42%);
            animation: frameFloat3 12s infinite alternate ease-in-out;
        }

        .frame-3 {
            top: clamp(43%, 61vh, 61%);
            animation: frameFloat1 13s infinite alternate ease-in-out;
        }

        .frame-4 {
            top: clamp(58%, 80vh, 80%);
            animation: frameFloat2 14s infinite alternate ease-in-out;
        }

        /* ========== ФОТО В РАМКЕ ========== */
        .frame-photo {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(35%, 42%, 42%);
            height: clamp(60%, 80%, 80%);
            border-radius: clamp(0.5rem, 2vw, 1.25rem);
            object-fit: cover;
            opacity: 0.8;
            filter: grayscale(30%) contrast(1.1) brightness(0.9);
            -webkit-filter: grayscale(30%) contrast(1.1) brightness(0.9);
            transition: 0.4s;
            z-index: 10;
            will-change: opacity, filter;
        }

        .photo-glow {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(35%, 45%, 45%);
            height: clamp(60%, 85%, 85%);
            border-radius: clamp(0.5rem, 2vw, 1.5rem);
            background: radial-gradient(ellipse,
                rgba(230, 57, 70, 0.5) 0%,
                rgba(230, 57, 70, 0.25) 40%,
                rgba(230, 57, 70, 0.08) 70%,
                transparent 100%);
            filter: blur(clamp(1rem, 4vw, 2.5rem));
            -webkit-filter: blur(clamp(1rem, 4vw, 2.5rem));
            z-index: 9;
            animation: photoGlowPulse 3s infinite alternate;
            will-change: opacity, transform;
        }

        /* ========== ТЕКСТ В РАМКЕ ========== */
        .frame-title {
            position: absolute;
            top: clamp(0.5rem, 2vh, 1.25rem);
            left: clamp(0.6rem, 2.5vw, 1.5rem);
            z-index: 9;
            font-size: clamp(0.7rem, 2.5vw, 1.6rem);
            font-weight: 900;
            color: rgba(180, 30, 40, 0.8);
            letter-spacing: clamp(0.2px, 0.1vw, 1px);
            text-shadow:
                0 0 clamp(0.3rem, 1vw, 0.6rem) rgba(180, 30, 40, 0.4),
                0 0 clamp(0.6rem, 2vw, 1.25rem) rgba(180, 30, 40, 0.2);
            text-transform: uppercase;
            white-space: nowrap;
            will-change: transform;
        }

        .frame-divider {
            position: absolute;
            top: clamp(1.8rem, 9vh, 5.9rem);
            left: clamp(0.6rem, 2.5vw, 1.5rem);
            width: clamp(5rem, 22vw, 13.75rem);
            height: clamp(0.15rem, 0.4vh, 0.25rem);
            background: linear-gradient(90deg,
                rgba(230, 57, 70, 0.7) 0%,
                rgba(230, 57, 70, 0.2) 100%);
            z-index: 9;
            border-radius: 2px;
            box-shadow: 0 0 clamp(0.3rem, 1vw, 0.6rem) rgba(230, 57, 70, 0.3);
        }

        .frame-inner {
            position: absolute;
            top: clamp(2.2rem, 11vh, 7.2rem);
            left: clamp(0.5rem, 2vw, 1.25rem);
            width: clamp(6rem, 23vw, 14.4rem);
            height: clamp(4rem, 15vh, 9.4rem);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: clamp(0.8rem, 3vw, 2rem);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            -moz-backdrop-filter: blur(15px);
            box-shadow:
                0 0 clamp(1rem, 3vw, 2rem) rgba(255, 255, 255, 0.06),
                inset 0 0 clamp(1rem, 3vw, 2rem) rgba(255, 255, 255, 0.04);
            z-index: 8;
            pointer-events: none;
        }

        .frame-subtitle {
            position: absolute;
            top: clamp(2.4rem, 12vh, 7.8rem);
            left: clamp(0.7rem, 3vw, 2rem);
            z-index: 9;
            font-size: clamp(0.55rem, 1.6vw, 0.95rem);
            font-weight: 900;
            color: rgba(160, 160, 168, 0.6);
            letter-spacing: clamp(0.1px, 0.05vw, 0.3px);
            max-width: clamp(5rem, 19vw, 11.9rem);
            line-height: 1.5;
            will-change: transform;
        }

        /* ========== ПЛЮСИКИ ========== */
        .plus {
            position: absolute;
            right: clamp(0.5rem, 1.8vw, 1.1rem);
            bottom: clamp(0.5rem, 1.8vh, 1.1rem);
            width: clamp(0.8rem, 2.4vw, 1.5rem);
            height: clamp(0.8rem, 2.4vw, 1.5rem);
            z-index: 8;
            pointer-events: none;
            opacity: 0.3;
            font-size: clamp(0.7rem, 2.2vw, 1.4rem);
            font-weight: bold;
            color: rgba(255, 255, 255, 0.45);
            text-shadow: 0 0 clamp(0.2rem, 0.8vw, 0.5rem) rgba(255, 255, 255, 0.15);
            line-height: 1;
            text-align: center;
        }

        /* ========== ЗВЁЗДЫ ========== */
        .star {
            position: fixed;
            z-index: 4;
            pointer-events: none;
            color: #ffffff;
            opacity: 0.3;
            animation: starDriftDown linear infinite;
            will-change: transform, opacity;
        }

        .star-tiny { font-size: clamp(0.1rem, 0.4vw, 0.2rem); }
        .star-small { font-size: clamp(0.15rem, 0.5vw, 0.25rem); }
        .star-micro { font-size: clamp(0.07rem, 0.3vw, 0.12rem); }
        .star-medium { font-size: clamp(0.18rem, 0.6vw, 0.3rem); }

        /* ========== ТУМАН И ПЫЛЬ ========== */
        .floor-mist {
            position: fixed;
            width: clamp(12rem, 75vw, 50rem);
            height: clamp(2.5rem, 20vh, 12.5rem);
            background: radial-gradient(ellipse, rgba(230, 57, 70, 0.06) 0%, transparent 60%);
            bottom: 0;
            left: 12%;
            z-index: 3;
            pointer-events: none;
            filter: blur(clamp(1.2rem, 5vw, 3rem));
            -webkit-filter: blur(clamp(1.2rem, 5vw, 3rem));
            animation: mistFloat 12s infinite alternate;
        }

        .dust {
            position: fixed;
            width: clamp(0.06rem, 0.2vw, 0.1rem);
            height: clamp(0.06rem, 0.2vw, 0.1rem);
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            box-shadow: 0 0 clamp(0.15rem, 0.5vw, 0.25rem) rgba(255, 255, 255, 0.3);
            animation: dustFloat 10s infinite alternate ease-in-out;
            will-change: transform, opacity;
        }

        /* ========== ВИНЬЕТКА И ШУМ ========== */
        .vignette-deep {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(10, 5, 6, 0.8) 70%, rgba(10, 5, 6, 0.95) 100%);
            z-index: 5;
            pointer-events: none;
        }

        .noise-texture {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='6' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            background-size: clamp(6rem, 15vw, 10.6rem) clamp(6rem, 15vw, 10.6rem);
            opacity: 0.05;
            z-index: 6;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        /* ========== АНИМАЦИИ ========== */
        @keyframes shadowBreath {
            0% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            100% { transform: translate(clamp(0.6rem, 3vw, 2rem), clamp(0.4rem, 2vw, 1.25rem)) scale(1.1); opacity: 1; }
        }

        @keyframes glowPulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }

        @keyframes shaftFade {
            0% { opacity: 0.08; filter: blur(0.25rem); }
            100% { opacity: 0.3; filter: blur(0.1rem); }
        }

        @keyframes gridPulse1 {
            0% { opacity: 0.6; transform: translate(0, 0); }
            100% { opacity: 0.85; transform: translate(clamp(-0.2rem, -1vw, -0.6rem), clamp(0.2rem, 1vw, 0.6rem)); }
        }

        @keyframes gridPulseSide {
            0% { opacity: 0.35; transform: translate(0, 0); }
            100% { opacity: 0.6; transform: translate(clamp(0.1rem, 0.5vw, 0.3rem), clamp(-0.1rem, -0.5vw, -0.3rem)); }
        }

        @keyframes frameFloat1 {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(clamp(-0.06rem, -0.3vw, -0.2rem)); }
        }

        @keyframes frameFloat2 {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(clamp(-0.04rem, -0.2vw, -0.13rem)); }
        }

        @keyframes frameFloat3 {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(clamp(-0.09rem, -0.4vw, -0.25rem)); }
        }

        @keyframes mistFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            100% { transform: translate(clamp(0.6rem, 3vw, 2rem), clamp(-0.2rem, -1vw, -0.6rem)) scale(1.1); opacity: 0.8; }
        }

        @keyframes dustFloat {
            0% { transform: translate(0, 0); opacity: 0.3; }
            100% { transform: translate(clamp(0.3rem, 1vw, 0.75rem), clamp(-0.5rem, -2vw, -1.25rem)); opacity: 0.7; }
        }

        @keyframes starDriftDown {
            0% { transform: translateY(-5vh) translateX(0); opacity: 0; }
            10% { opacity: 0.4; }
            50% { opacity: 0.3; }
            90% { opacity: 0.2; }
            100% { transform: translateY(105vh) translateX(15px); opacity: 0; }
        }

        @keyframes photoGlowPulse {
            0% { opacity: 0.7; transform: translateY(-50%) scale(1); }
            100% { opacity: 1; transform: translateY(-50%) scale(1.1); }
        }

        /* ========== МЕДИА-ЗАПРОСЫ ========== */
        /* Маленькие телефоны */
        @media (max-width: 480px) {
            .frame {
                width: clamp(10rem, 90vw, 24rem);
                height: clamp(3.5rem, 16vh, 6rem);
                border-radius: clamp(0.5rem, 2vw, 1.2rem);
            }
            .frame-1 {
                height: clamp(6rem, 30vh, 11rem);
            }
            .frame-2 { top: 30%; }
            .frame-3 { top: 48%; }
            .frame-4 { top: 66%; }
            .frame-subtitle {
                max-width: clamp(4.5rem, 45vw, 10rem);
                font-size: clamp(0.5rem, 2.2vw, 0.75rem);
                line-height: 1.4;
            }
            .frame-title {
                font-size: clamp(0.55rem, 3.5vw, 0.9rem);
            }
            .frame-divider {
                top: clamp(1.2rem, 7vh, 2.8rem);
                width: clamp(3.5rem, 40vw, 9rem);
            }
            .frame-photo {
                width: clamp(30%, 40%, 40%);
                height: clamp(50%, 70%, 70%);
            }
            .photo-glow {
                width: clamp(32%, 42%, 42%);
                height: clamp(55%, 75%, 75%);
            }
            .grid-top-right {
                width: clamp(4rem, 30vw, 12rem);
                height: clamp(4rem, 30vw, 12rem);
            }
            .grid-left,
            .grid-right {
                width: clamp(2.5rem, 18vw, 5rem);
                height: clamp(2.5rem, 18vw, 5rem);
            }
            .star-tiny { font-size: clamp(0.08rem, 0.8vw, 0.15rem); }
            .star-small { font-size: clamp(0.1rem, 1vw, 0.2rem); }
            .star-micro { font-size: clamp(0.05rem, 0.5vw, 0.1rem); }
            .star-medium { font-size: clamp(0.12rem, 1.2vw, 0.22rem); }
        }

        /* Большие телефоны */
