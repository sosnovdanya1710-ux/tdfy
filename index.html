<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="format-detection" content="telephone=no">
    <title>Фон — Красная комната</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        body {
            background-color: #0a0506;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-overflow-scrolling: touch;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .room-base {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0a0506;
            background-image: 
                radial-gradient(ellipse at 50% 40%, rgba(45, 8, 12, 0.8) 0%, rgba(45, 8, 12, 0) 60%),
                radial-gradient(ellipse at 15% 85%, rgba(35, 5, 8, 0.9) 0%, rgba(35, 5, 8, 0) 50%),
                radial-gradient(ellipse at 85% 15%, rgba(28, 4, 7, 0.7) 0%, rgba(28, 4, 7, 0) 45%);
            z-index: 0;
            pointer-events: none;
        }

        .room-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, #0d0405 0%, #1a0709 20%, #22090c 40%, #160607 60%, #0b0304 80%, #090203 100%);
            z-index: 0;
            pointer-events: none;
        }

        .shadow {
            position: fixed;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        .shadow-1 {
            width: 80vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 70%);
            top: 30%;
            left: 10%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .shadow-2 {
            width: 45vw;
            height: 85vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 65%);
            top: 8%;
            left: -18%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .shadow-3 {
            width: 40vw;
            height: 75vh;
            background: radial-gradient(ellipse, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 60%);
            top: 18%;
            right: -12%;
            -webkit-filter: blur(50px);
            filter: blur(50px);
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
        }

        .glow-1 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.3) 0%, rgba(230, 57, 70, 0) 70%);
            top: 28%;
            left: 22%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-2 {
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(155, 28, 40, 0.35) 0%, rgba(155, 28, 40, 0) 65%);
            bottom: 8%;
            right: 12%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-3 {
            width: 38vw;
            height: 38vw;
            background: radial-gradient(circle, rgba(255, 77, 90, 0.25) 0%, rgba(255, 77, 90, 0) 70%);
            top: 8%;
            left: 48%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        .glow-4 {
            width: 65vw;
            height: 25vh;
            background: radial-gradient(ellipse, rgba(230, 57, 70, 0.28) 0%, rgba(230, 57, 70, 0) 70%);
            bottom: -5%;
            left: 18%;
            -webkit-filter: blur(60px);
            filter: blur(60px);
        }

        /* Сетка на весь экран */
        .grid-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
            background-size: clamp(30px, 5vw, 50px) clamp(30px, 5vw, 50px);
            opacity: 0.4;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px;
            gap: 20px;
            min-height: 100vh;
            justify-content: flex-start;
        }

        /* Рамки с лёгким блюром */
        .frame {
            position: relative;
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(255,255,255,0.04), inset 0 0 20px rgba(255,255,255,0.03);
            background: rgba(255,255,255,0.01);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            -moz-backdrop-filter: blur(4px);
            width: 100%;
            max-width: 420px;
            flex-shrink: 0;
        }

        .frame-main {
            height: 280px;
            overflow: hidden;
        }

        .frame-small {
            height: 130px;
            position: relative;
        }

        /* Фото */
        .photo {
            position: absolute;
            right: -10px;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 55%;
            height: 85%;
            border-radius: 20px;
            object-fit: contain;
            opacity: 0.85;
            -webkit-filter: grayscale(20%) contrast(1.05) brightness(0.95);
            filter: grayscale(20%) contrast(1.05) brightness(0.95);
            z-index: 10;
        }

        /* Неон */
        .photo-glow {
            position: absolute;
            right: -15px;
            top: 50%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            width: 58%;
            height: 90%;
            border-radius: 25px;
            background: radial-gradient(ellipse, rgba(230,57,70,0.7) 0%, rgba(230,57,70,0.35) 40%, rgba(230,57,70,0.1) 70%, rgba(230,57,70,0) 100%);
            -webkit-filter: blur(30px);
            filter: blur(30px);
            z-index: 9;
            animation: neonPulse 2.5s infinite alternate;
        }

        @keyframes neonPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* Заголовок большой — ТЁМНО-КРАСНЫЙ */
        .title-left {
            position: absolute;
            top: 20px;
            left: 25px;
            z-index: 11;
            font-size: 38px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            max-width: 45%;
            line-height: 1.1;
        }

        .title-red {
            color: #b8121f;
            text-shadow: 0 0 12px rgba(180, 15, 25, 0.4);
        }

        .title-white {
            color: rgba(235, 235, 240, 0.7);
            text-shadow: 0 0 8px rgba(235, 235, 240, 0.25);
        }

        /* Кнопка красная */
        .btn-red {
            position: absolute;
            top: 120px;
            left: 25px;
            z-index: 11;
            padding: 16px 50px;
            border: 1.5px solid rgba(200, 20, 30, 0.6);
            border-radius: 30px;
            background: rgba(200, 20, 30, 0.25);
            color: rgba(255, 255, 255, 0.85);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(200, 20, 30, 0.35), inset 0 0 18px rgba(200, 20, 30, 0.12);
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 45%;
            white-space: nowrap;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-red:active {
            transform: scale(0.95);
            background: rgba(200, 20, 30, 0.32);
        }

        /* Кнопка белая */
        .btn-white {
            position: absolute;
            top: 195px;
            left: 25px;
            z-index: 11;
            padding: 16px 50px;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.75);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset 0 0 18px rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            max-width: 45%;
            white-space: nowrap;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-white:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.18);
        }

        /* Заголовки в малых рамках — ТЁМНО-КРАСНЫЙ */
        .second-title,
        .third-title,
        .fourth-title {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 11;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .second-red,
        .third-red,
        .fourth-red {
            color: #b8121f;
            text-shadow: 0 0 12px rgba(180, 15, 25, 0.4);
        }

        .second-white,
        .third-white,
        .fourth-white {
            color: rgba(235, 235, 240, 0.7);
            text-shadow: 0 0 8px rgba(235, 235, 240, 0.25);
        }

        /* Разделительная линия */
        .divider-line {
            width: 92%;
            max-width: 400px;
            height: 1.5px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(180, 15, 25, 0.6) 20%, 
                rgba(235, 235, 240, 0.3) 50%, 
                rgba(180, 15, 25, 0.6) 80%, 
                transparent 100%);
            opacity: 0.7;
            margin: 5px 0;
            border-radius: 2px;
        }

        .plus {
            position: absolute;
            right: 18px;
            bottom: 18px;
            width: 24px;
            height: 24px;
            z-index: 8;
            opacity: 0.3;
            font-size: 22px;
            font-weight: bold;
            color: rgba(255,255,255,0.45);
            text-shadow: 0 0 8px rgba(255,255,255,0.15);
            line-height: 1;
            text-align: center;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(ellipse at center, transparent 25%, rgba(10,5,6,0.8) 70%, rgba(10,5,6,0.95) 100%);
            z-index: 5;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .content {
                padding: 15px 15px 30px;
                gap: 15px;
            }
            .frame-main {
                height: 220px;
                border-radius: 20px;
            }
            .frame-small {
                height: 110px;
                border-radius: 20px;
            }
            .photo {
                width: 58%;
                height: 85%;
                border-radius: 15px;
                right: -8px;
            }
            .photo-glow {
                width: 62%;
                height: 90%;
                right: -12px;
            }
            .title-left {
                top: 15px;
                left: 15px;
                font-size: 24px;
                letter-spacing: 0.3px;
                max-width: 42%;
            }
            .btn-red {
                top: 85px;
                left: 10px;
                padding: 12px 30px;
                font-size: 15px;
                letter-spacing: 0.8px;
                max-width: 48%;
                border-radius: 28px;
            }
            .btn-white {
                top: 145px;
                left: 10px;
                padding: 12px 30px;
                font-size: 13px;
                letter-spacing: 0.5px;
                max-width: 48%;
                border-radius: 28px;
            }
            .second-title,
            .third-title,
            .fourth-title {
                top: 10px;
                left: 12px;
                font-size: 18px;
                letter-spacing: 0.3px;
            }
            .divider-line {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="room-base"></div>
    <div class="room-gradient"></div>
    <div class="shadow shadow-1"></div>
    <div class="shadow shadow-2"></div>
    <div class="shadow shadow-3"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="glow glow-4"></div>
    <div class="grid-full"></div>

    <div class="content">
        <div class="frame frame-main">
            <div class="photo-glow"></div>
            <img class="photo" src="https://i.postimg.cc/SsmHrJGk/file-00000000e5d081f49bc9e7c6512b4e6e.png" alt="Фото">
            <div class="title-left">
                <span class="title-red">Викладач</span> <span class="title-white">Англійської</span>
            </div>
            <button class="btn-red">Записатись</button>
            <button class="btn-white">Пробний урок</button>
        </div>

        <div class="divider-line"></div>

        <div class="frame frame-small">
            <div class="second-title">
                <span class="second-red">Про</span> <span class="second-white">мене</span>
            </div>
        </div>

        <div class="frame frame-small">
            <div class="third-title">
                <span class="third-red">Вар</span><span class="third-white">тість</span>
            </div>
        </div>

        <div class="frame frame-small">
            <div class="fourth-title">
                <span class="fourth-red">Від</span><span class="fourth-white">гуки</span>
            </div>
        </div>
    </div>

    <div class="vignette"></div>
</body>
</html>
